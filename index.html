<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>wontech · 국내영업 매출현황</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230891b2'/><g transform='translate(13,36) scale(0.144)' fill='%23fff'><rect width='110' height='110' rx='28'/><rect x='204' width='110' height='110' rx='28'/><rect x='408' width='110' height='110' rx='28'/><rect x='102' y='97' width='110' height='110' rx='28'/><rect x='306' y='97' width='110' height='110' rx='28'/></g></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--blue:#2563eb;--navy:#16324f;--ink:#182230;--text:#1f2937;--text-2:#64748b;--mut:#94a3b8;--border:#e4e8ef;--line:#eef1f5;--bg:#f5f7fb;--white:#fff;--green:#15803d;--red:#dc2626;--amber:#d97706;--sidebar-bg:#f1f5f9;--sidebar-hover:#eef2f7;--sidebar-active:#eaf1fd}
*{box-sizing:border-box}
html{color-scheme:only light}
body{display:flex;min-height:100vh;background:var(--bg);font-family:'Noto Sans KR',sans-serif;margin:0;color:var(--text);font-size:14px}
.main table,.tabular{font-variant-numeric:tabular-nums}
/* ── 사이드바 ── */
.sidebar{width:220px;background:var(--sidebar-bg);min-height:100vh;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto;display:flex;flex-direction:column;border-right:1px solid #d8e0ea;box-shadow:3px 0 16px rgba(16,42,67,.06)}
.sidebar-brand{padding:22px 20px 16px;color:#1c2534;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.brand-icon{width:32px;height:32px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex-shrink:0}
.brand-name{font-size:15px;font-weight:700;letter-spacing:-.3px;color:#1c2534}
.brand-sub{font-size:10px;color:var(--mut);margin-top:1px}
.nav-section{padding:12px 0}
.nav-label{padding:6px 20px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#475569;text-transform:uppercase}
.sidebar .nav-link{color:#475569;padding:8px 18px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px;cursor:pointer;transition:all .15s;margin:1px 8px;border-radius:6px}
.sidebar .nav-link i{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.sidebar .nav-link:hover{color:#1c2534;background:var(--sidebar-hover)}
.sidebar .nav-link.active{color:var(--blue);background:var(--sidebar-active);font-weight:600}
.sidebar .nav-link.active i{color:var(--blue)}
.sidebar-footer{margin-top:auto;padding:12px 8px;border-top:1px solid var(--border)}
/* ── 메인 ── */
.main{flex:1;margin-left:220px;padding:26px 30px 80px;min-height:100vh;min-width:0}
.wt-mast{padding-bottom:13px;border-bottom:2px solid var(--navy);margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px}
.wt-mast .kick{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.wt-mast .t{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.01em;margin-top:4px;display:flex;align-items:center;gap:9px}
.wt-mast .t i{color:var(--blue);font-size:20px}
.wt-mast .asof{font-size:12px;color:var(--text-2);text-align:right}
/* 필터 툴바 */
.wt-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:18px}
.wt-tools .fl{font-size:11px;font-weight:700;color:var(--text-2);display:flex;align-items:center;gap:5px}
.wt-tab{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#475569;background:#fff;border:1px solid #dbe3ec;border-radius:8px;padding:6px 13px;cursor:pointer;transition:all .15s;line-height:1;white-space:nowrap}
.wt-tab:hover{background:#eff4fb;border-color:#a9c4e8;color:var(--blue)}
.wt-tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.wt-tools .form-select,.wt-tools .form-control{font-size:12.5px;border-color:#dbe3ec;color:var(--text);border-radius:8px;padding:6px 10px;width:auto}
.wt-tools .form-control:focus,.wt-tools .form-select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.wt-sep{width:1px;height:22px;background:var(--border);margin:0 3px}
.wt-cnt{margin-left:auto;font-size:12px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums}
.wt-cnt b{color:var(--ink)}
/* 히어로+팩트 밴드 */
.wt-band{display:flex;align-items:stretch;background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px 26px;margin-bottom:20px}
.wt-hero{flex:1.4;padding-right:24px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.wt-hero .l{font-size:11.5px;font-weight:700;color:var(--text-2)}
.wt-hero>b{font-size:38px;font-weight:800;color:var(--blue);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.08}
.wt-hero>b .u{font-size:19px;font-weight:700;margin-left:2px}
.wt-hero .s{font-size:12px;color:var(--text-2);margin-top:3px}
.wt-fact{flex:1;padding:2px 16px;border-left:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;min-width:0}
.wt-fact.clk{cursor:pointer}
.wt-fact .l{font-size:11px;font-weight:700;color:var(--text-2);white-space:nowrap}
.wt-fact b{font-size:21px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:2px}
.wt-fact b .u{font-size:12px;font-weight:700;margin-left:1px}
.wt-fact .s{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt-fact b.rd{color:var(--red)}.wt-fact b.gr{color:var(--green)}
/* 카드/섹션 */
.wt-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 18px;min-width:0}
.wt-st{font-size:14px;font-weight:800;color:var(--ink);padding-bottom:8px;border-bottom:2px solid var(--navy);margin-bottom:13px;display:flex;align-items:center;gap:8px}
.wt-st i{color:var(--blue);font-size:15px}
.wt-st .hint{margin-left:auto;font-size:11px;font-weight:500;color:var(--mut)}
.wt-grid{display:grid;gap:16px}
.g-2{grid-template-columns:1fr 1fr}.g-32{grid-template-columns:1.9fr 1fr}
/* 표 (문서 언어 테마) */
.wt-tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.wt-tbl thead th{background:#fafbfc;color:#475569;font-size:11.5px;font-weight:700;border-top:2px solid var(--navy);border-bottom:1px solid var(--border);padding:8px 10px;text-align:right;white-space:nowrap;position:sticky;top:0;cursor:pointer;user-select:none}
.wt-tbl thead th.l{text-align:left}.wt-tbl thead th:hover{color:var(--blue)}
.wt-tbl tbody td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right;white-space:nowrap;color:var(--text)}
.wt-tbl tbody td.l{text-align:left}
.wt-tbl tbody tr{cursor:pointer}
.wt-tbl tbody tr:hover{background:#f8fafc}
.wt-tbl .rk{color:var(--mut);font-weight:700;text-align:center;width:26px}
.wt-tbl .nm{font-weight:600;color:var(--ink)}
.wt-tbl b{color:var(--ink);font-weight:700}
.mut{color:var(--mut)}.tx2{color:var(--text-2)}
.bar{background:#eef2f7;height:6px;border-radius:3px;overflow:hidden;min-width:46px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.scroll{overflow:auto;max-height:62vh}
.badge-st{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap}
.ins{margin-top:0;font-size:12.5px;color:#42506a;background:#f7f9fc;border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:8px;padding:11px 15px;line-height:1.6}
.ins b{color:var(--ink)}.ins .rd{color:var(--red)}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:34px}
canvas{max-height:250px}
/* 사이트 스위처 / 유저 */
.sw-wrap{position:relative}
.sw-btn{width:100%;background:#fff;border:1px solid #dbe3ec;border-radius:8px;padding:8px 11px;color:#475569;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;text-align:left}
.sw-btn:hover{border-color:#a9c4e8;color:var(--blue)}
.sw-dd{display:none;position:absolute;bottom:112%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 -8px 24px rgba(16,42,67,.14);z-index:500;max-height:56vh;overflow-y:auto}
.sw-dd.open{display:block}
.sw-item{display:flex;align-items:center;gap:9px;padding:9px 12px;font-size:12.5px;color:#475569;cursor:pointer}
.sw-item:hover{background:var(--sidebar-hover)}
.sw-item .bdg{min-width:26px;height:19px;border-radius:5px;color:#fff;font-size:9.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0}
.uinfo{margin-top:9px;font-size:11.5px;color:var(--text-2);display:flex;align-items:center;gap:6px;padding:0 4px}
.uinfo .nm{color:var(--ink);font-weight:600}
.uinfo button{margin-left:auto;background:none;border:none;color:var(--mut);font-size:11px;text-decoration:underline;padding:0}
.uinfo button:hover{color:var(--blue)}
/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(16,42,67,.42);display:none;align-items:center;justify-content:center;z-index:8000;padding:16px}
.modal-bg.on{display:flex}
.mbox{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 12px 34px rgba(15,23,42,.16);border:1px solid var(--border)}
.mhd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 22px 13px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.mhd h3{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.01em;margin:0}
.mhd .x{background:none;border:none;font-size:19px;color:var(--mut);line-height:1;cursor:pointer}
.mbody{padding:16px 22px 22px}
.dsec{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.04em;margin:16px 0 5px;text-transform:uppercase}
.dsec:first-child{margin-top:0}
.drow{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.drow .k{color:var(--text-2);flex-shrink:0}
.drow .v{font-weight:600;color:var(--ink);text-align:right}
.tl{display:flex;margin:12px 0 4px}
.tl .st{flex:1;text-align:center;position:relative;font-size:10.5px}
.tl .st .dot{width:11px;height:11px;border-radius:50%;background:#cbd5e1;margin:0 auto 5px;border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1}
.tl .st.done .dot{background:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.tl .st b{display:block;color:var(--ink);font-weight:600;margin-bottom:1px}
.tl .st .dt{color:var(--mut);font-size:10px}
.tl .st:not(:last-child):after{content:'';position:absolute;top:5px;left:50%;width:100%;height:2px;background:#e2e8f0;z-index:0}
.tl .st.done:not(:last-child):after{background:var(--blue)}
/* 로딩/로그인 */
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:9000;color:var(--mut);font-size:13px}
.spin{width:22px;height:22px;border:3px solid #dbe3ee;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin-right:10px}
@keyframes sp{to{transform:rotate(360deg)}}
#login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f2540,#1e3a5f);z-index:9001;padding:20px}
.lbox{background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.lbox h1{font-size:17px;font-weight:800;color:var(--ink);margin:0 0 3px;display:flex;align-items:center;gap:8px}
.lbox h1 i{color:var(--blue)}
.lbox p{font-size:12px;color:var(--mut);margin:0 0 20px}
.lbox .form-control{margin-bottom:10px;font-size:14px;padding:11px 13px}
.lbox .btn{width:100%;font-weight:700;padding:11px;margin-top:4px}
#login-err{display:none;color:var(--red);font-size:12px;margin-top:8px;text-align:center}
#noacc{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:9001;color:var(--ink);text-align:center;padding:30px;gap:16px}
#toast{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:9500}
.view{display:none}.view.on{display:block}
.chg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#eff5ff;border:1px solid #cfe0fb;border-radius:10px;padding:9px 14px;margin-bottom:16px;font-size:12.5px;color:#42506a}
.chg>i{color:var(--blue);font-size:14px}
.chg .lb{font-weight:700;color:var(--ink)}
.chg b{font-weight:700;background:#fff;border:1px solid #d8e3f5;border-radius:20px;padding:2px 11px;color:var(--blue);font-variant-numeric:tabular-nums}
.chg b.g{color:var(--green);border-color:#bbf7d0}.chg b.r{color:var(--red);border-color:#fecaca}
.chg .mo{background:none;border:none;color:var(--blue);font-size:12px;font-weight:600;text-decoration:underline;cursor:pointer}
.chg .cx{margin-left:auto;background:none;border:none;color:var(--mut);font-size:13px;cursor:pointer}
.mtoggle{display:none}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);transition:transform .2s;z-index:600}
  .sidebar.open{transform:none}
  .main{margin-left:0;padding:16px 14px 70px}
  .g-2,.g-32{grid-template-columns:1fr}
  .wt-band{flex-wrap:wrap;gap:14px}.wt-hero{flex:1 1 100%;border-bottom:1px solid var(--border);padding:0 0 12px;margin-bottom:2px}.wt-fact{border-left:0;padding:0;flex:1 1 40%}
  .mtoggle{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:1px solid #dbe3ec;background:#fff;color:#475569;font-size:17px}
}
</style>
</head>
<body>

<div id="load"><div class="spin"></div>불러오는 중…</div>

<div id="login">
  <div class="lbox">
    <h1><i class="bi bi-clipboard-data"></i> 국내영업 매출현황</h1>
    <p>원텍 국내 계약 관리 · 로그인</p>
    <input id="li" type="email" class="form-control" placeholder="이메일" autocomplete="username">
    <input id="lp" type="password" class="form-control" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary" onclick="doLogin()">로그인</button>
    <div id="login-err">이메일 또는 비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<div id="noacc">
  <div style="font-size:16px;line-height:1.6"><i class="bi bi-shield-lock" style="color:var(--amber)"></i> 국내영업 매출현황 접근 권한이 없습니다.<br>영업전략파트 또는 관리자에게 문의해주세요.</div>
  <button class="btn btn-outline-secondary btn-sm" onclick="doLogout()">로그아웃</button>
</div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon"><i class="bi bi-clipboard-data"></i></div>
    <div><div class="brand-name">국내영업</div><div class="brand-sub">매출·계약 현황</div></div>
  </div>
  <nav class="nav-section" id="nav"></nav>
  <div class="sidebar-footer">
    <div class="sw-wrap">
      <button class="sw-btn" onclick="document.getElementById('swdd').classList.toggle('open')"><i class="bi bi-grid-3x3-gap"></i><span style="flex:1">사이트 이동</span><i class="bi bi-chevron-up" style="font-size:10px"></i></button>
      <div class="sw-dd" id="swdd"></div>
    </div>
    <div class="uinfo"><span class="nm" id="ui-name">-</span><button onclick="changePw()">비번</button><button onclick="doLogout()">로그아웃</button></div>
  </div>
</aside>

<main class="main">
  <div class="wt-mast">
    <div style="display:flex;align-items:center;gap:11px">
      <button class="mtoggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="bi bi-list"></i></button>
      <div><div class="kick">WONTECH · 국내영업</div><div class="t" id="v-title"><i class="bi bi-bar-chart-line-fill"></i>종합 현황</div></div>
    </div>
    <div class="asof" id="asof"></div>
  </div>

  <div id="chgbar"></div>

  <div class="wt-tools">
    <span class="fl"><i class="bi bi-calendar3"></i> 조회 월</span>
    <span id="mchips"></span>
    <div class="wt-sep"></div>
    <select id="f-channel" class="form-select form-select-sm" onchange="applyF()"><option value="">전체 채널</option></select>
    <select id="f-rep" class="form-select form-select-sm" onchange="applyF()"><option value="">전체 담당자</option></select>
    <select id="f-product" class="form-select form-select-sm" onchange="applyF()"><option value="">전체 제품</option></select>
    <select id="f-status" class="form-select form-select-sm" onchange="applyF()"><option value="">전체 상태</option></select>
    <select id="f-region" class="form-select form-select-sm" onchange="applyF()"><option value="">전체 지역</option></select>
    <input id="f-search" class="form-control form-control-sm" style="min-width:170px" placeholder="거래처·제품 검색" oninput="applyF()">
    <button class="wt-tab" onclick="resetF()"><i class="bi bi-arrow-counterclockwise"></i>초기화</button>
    <span class="wt-cnt" id="fcount"></span>
  </div>

  <div id="view-overview" class="view on"></div>
  <div id="view-delivery" class="view"></div>
  <div id="view-oligio" class="view"></div>
  <div id="view-rep" class="view"></div>
  <div id="view-product" class="view"></div>
  <div id="view-channel" class="view"></div>
  <div id="view-pay" class="view"></div>
  <div id="view-list" class="view"></div>
</main>

<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

<script>
const SUPA_URL='https://mhfacbsittfdkknwybhc.supabase.co';
const SUPA_KEY='sb_publishable_aPMOOWAlyJlMcP1ZM_gpPA_jlrcvCRd';
const CENTRAL='https://wt-management.github.io/wontech/';
const _sb=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let DATA=null, ROWS=[], F={months:new Set(), channel:'', rep:'', product:'', status:'', region:'', search:''}, _charts=[], curView='overview', ME='';

/* ── 유틸 ── */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function jsq(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function eok(v){return ((v||0)/1e8);}
function won2p(v){return eok(v).toFixed(2)+'억';}
function won1(v){return eok(v).toFixed(1)+'억';}
function wonS(v){v=Math.round(v||0);return v>=1e8?(v/1e8).toFixed(1)+'억':v>=1e4?Math.round(v/1e4).toLocaleString()+'만':v.toLocaleString();}
function fmt(v){return Math.round(v||0).toLocaleString();}
function pctv(a,b){return b>0?Math.round(a/b*100):0;}

/* ── 변동 감지 (개인별 localStorage 스냅샷 diff) ── */
function detectChanges(){
  try{ const key='wtKorSnap:'+ME; const cur={};
    ROWS.forEach(r=>{ cur[r.no]=(has(r.dDelivered)?'D':'_')+(/취소/.test((r.status||'')+(r.pay||''))?'X':''); });
    let prev=null; try{ prev=JSON.parse(localStorage.getItem(key)||'null'); }catch(e){}
    const chg={neo:[],del:[],can:[]};
    if(prev&&prev.map){ ROWS.forEach(r=>{ const p=prev.map[r.no], c=cur[r.no];
      if(p===undefined){ chg.neo.push(r); }
      else{ if(p[0]!=='D'&&c[0]==='D')chg.del.push(r); if(p.indexOf('X')<0&&c.indexOf('X')>=0)chg.can.push(r); } }); }
    window.__chg=(prev&&prev.map)?chg:null;
    localStorage.setItem(key,JSON.stringify({rev:DATA.updatedAt||'',map:cur}));
  }catch(e){ window.__chg=null; }
}
function renderChgBar(){ const c=window.__chg, el=document.getElementById('chgbar'); if(!el)return;
  if(!c||(!c.neo.length&&!c.del.length&&!c.can.length)){ el.innerHTML=''; return; }
  el.innerHTML='<div class="chg"><i class="bi bi-bell-fill"></i><span class="lb">지난 방문 이후 변동</span>'+
    (c.neo.length?'<b>신규 계약 '+c.neo.length+'</b>':'')+
    (c.del.length?'<b class="g">납품 완료 전환 '+c.del.length+'</b>':'')+
    (c.can.length?'<b class="r">취소 '+c.can.length+'</b>':'')+
    '<button class="mo" onclick="showChg()">자세히</button><button class="cx" onclick="document.getElementById(\'chgbar\').innerHTML=\'\'"><i class="bi bi-x-lg"></i></button></div>'; }
function showChg(){ const c=window.__chg; if(!c)return;

function initFilters(){
  const months=[...new Set(ROWS.map(r=>r._month).filter(Boolean))].sort((a,b)=>a-b);
  let h='<button class="wt-tab on" data-m="all" onclick="setMonth(\'all\')">전체</button>';
  months.forEach(m=>h+='<button class="wt-tab" data-m="'+m+'" onclick="setMonth('+m+')">'+m+'월</button>');
  document.getElementById('mchips').innerHTML=h;
  fillSel('f-channel',[...new Set(ROWS.map(r=>r.channel))]);
  fillSel('f-rep',[...new Set(ROWS.map(r=>r.rep))].sort());
  fillSel('f-product',[...new Set(ROWS.map(r=>r.product))].sort());
  fillSel('f-status',[...new Set(ROWS.map(r=>r.status))]);
  fillSel('f-region',[...new Set(ROWS.map(r=>r.region))].sort());
}
function fillSel(id,arr){ const s=document.getElementById(id); const first=s.options[0].outerHTML; s.innerHTML=first+arr.filter(Boolean).map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join(''); }
function setMonth(m){ if(m==='all'){F.months.clear();} else { m=+m; if(F.months.has(m))F.months.delete(m); else F.months.add(m); }
  document.querySelectorAll('#mchips .wt-tab').forEach(b=>{ const d=b.dataset.m; b.classList.toggle('on', d==='all'?F.months.size===0:F.months.has(+d)); });
  applyF();
}
function applyF(){ F.channel=document.getElementById('f-channel').value; F.rep=document.getElementById('f-rep').value; F.product=document.getElementById('f-product').value; F.status=document.getElementById('f-status').value; F.region=document.getElementById('f-region').value; F.search=(document.getElementById('f-search').value||'').trim().toLowerCase(); render(); }
function resetF(){ F={months:new Set(),channel:'',rep:'',product:'',status:'',region:'',search:''}; ['f-channel','f-rep','f-product','f-status','f-region','f-search'].forEach(id=>document.getElementById(id).value=''); document.querySelectorAll('#mchips .wt-tab').forEach(b=>b.classList.toggle('on',b.dataset.m==='all')); render(); }
function filtered(){ return ROWS.filter(r=>{
  if(F.months.size&&!F.months.has(r._month))return false;
  if(F.channel&&r.channel!==F.channel)return false;
  if(F.rep&&r.rep!==F.rep)return false;
  if(F.product&&r.product!==F.product)return false;
  if(F.status&&r.status!==F.status)return false;
  if(F.region&&(r.region||'미분류')!==F.region)return false;
  if(F.search){ const s=(r.cust+' '+r.product+' '+r.rep+' '+r.ceo).toLowerCase(); if(s.indexOf(F.search)<0)return false; }
  return true; });
}

/* ── 납품 확인 ── */
function vDelivery(R){
  const undel=R.filter(r=>!has(r.dDelivered)), done=R.length-undel.length, T=today0();
  const overdue=undel.filter(r=>{const d=pd(r.dDeliverDue);return d&&d<T;});
  const upcoming=undel.filter(r=>{const d=pd(r.dDeliverDue);return d&&d>=T;});
  const noDate=undel.filter(r=>!has(r.dDeliverDue));
  const sorted=undel.slice().sort((a,b)=>{const da=pd(a.dDeliverDue),db=pd(b.dDeliverDue);if(!da&&!db)return 0;if(!da)return 1;if(!db)return -1;return da-db;});
  let h='<div class="wt-band" style="padding:16px 22px">'+
    '<div class="wt-hero" style="flex:.9"><span class="l">미납품 <span class="mut" style="font-size:10px;font-weight:500">· 수주-미납품</span></span><b'+(overdue.length?' class="rd"':'')+'>'+undel.length+'<span class="u">건</span></b><span class="s">납품완료 '+done+' / 전체 '+R.length+'건</span></div>'+
    fact('납품예정일 경과',overdue.length,'건','지연 — 확인 필요',overdue.length?'rd':'')+
    fact('예정일 도래 전',upcoming.length,'건','정상 대기')+
    fact('예정일 미정',noDate.length,'건','일정 불명확',noDate.length?'rd':'')+
  '</div>';
  h+='<div class="wt-card">'+st('bi-truck','납품 대기 목록','납품예정일 순 · 지연 붉게 · 지역 필터로 지방 확인 · 행 클릭 상세')+
    (sorted.length?'<div class="scroll"><table class="wt-tbl"><thead><tr><th class="rk">#</th><th class="l">거래처</th><th class="l">제품</th><th class="l">지역</th><th>납품예정</th><th>D-day</th><th class="l">담당</th><th class="l">출고예정</th></tr></thead><tbody>'+
    sorted.map(r=>{const d=pd(r.dDeliverDue);const dd=d?Math.round((d-T)/864e5):null;const late=dd!==null&&dd<0;const lst=late?' style="color:var(--red);font-weight:700"':'';
      return '<tr onclick="detail('+r.no+')"><td class="rk">'+r.no+'</td><td class="l nm">'+esc(r.cust)+'</td><td class="l">'+esc(r.product)+'</td><td class="l">'+esc(r.region||'-')+'</td><td'+lst+'>'+esc(r.dDeliverDue||'미정')+'</td><td'+lst+'>'+(dd===null?'-':(dd<0?(-dd)+'일 지연':dd===0?'D-day':'D-'+dd))+'</td><td class="l">'+esc(r.rep)+'</td><td class="l tx2">'+esc(r.dShipDue||'-')+'</td></tr>';}).join('')+
    '</tbody></table></div>':'<div class="empty"><i class="bi bi-check-circle" style="color:var(--green)"></i> 조건에 맞는 미납품 계약이 없습니다</div>')+'</div>';
  document.getElementById('view-delivery').innerHTML=h;
}

    waiting.map(r=>'<tr onclick="detail('+r.no+')"><td class="rk">'+r.no+'</td><td class="l nm">'+esc(r.cust)+'</td><td class="l">'+esc(r.product)+'</td><td class="l">'+esc(r.region||'-')+'</td><td>'+esc(r.dDeliverDue||'미정')+'</td><td class="l">'+esc(r.rep)+'</td></tr>').join('')+

/* ── CSV ── */
function exportCsv(){
  const R=filtered().slice().sort((a,b)=>a.no-b.no);
  const cols=[['no','NO'],['cust','거래처'],['product','제품'],['amount','계약금액'],['krw','원화환산'],['rep','담당자'],['channel','채널'],['status','상태'],['saleMonth','매출월'],['region','지역'],['biz','진료과'],['pay','수금방법'],['dContract','계약접수'],['dDelivered','납품일'],['dTax','세금계산서']];
  let csv='\ufeff'+cols.map(c=>c[1]).join(',')+'\n';
  R.forEach(r=>{ csv+=cols.map(c=>{let v=r[c[0]];v=(v==null?'':String(v)).replace(/"/g,'""');return /[",\n]/.test(v)?'"'+v+'"':v;}).join(',')+'\n'; });
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='국내영업_계약_'+(DATA.updatedAt||'')+'.csv'; a.click(); toast('CSV 내보내기 완료');
}

  let ac=[],ad=false,stf=false; try{ const s=(await _sb.auth.getSession()).data.session; if(s&&s.user){ if(s.user.email==='pmw0406@gmail.com')ad=true; const p=await _sb.from('crm_profiles').select('access,role,dept').eq('id',s.user.id).maybeSingle(); if(p&&p.data){ac=(p.data.access||'').split(',').map(x=>x.trim()).filter(Boolean); if(p.data.role==='admin')ad=true; stf=String(p.data.dept||'').replace(/\s/g,'').includes('영업전략');} } }catch(e){}
  const vis=s=>{ if(ac.indexOf(s.key)>=0)return true; if(s.admin_bypass&&ad)return true; if(s.extra_visible_rule){try{return !!(new Function('access','isAdmin','isStrat','return('+s.extra_visible_rule+')'))(ac,ad,stf);}catch(e){return false;}} return false; };

  window._swItems=items;
}
