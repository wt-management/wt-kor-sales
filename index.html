<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>wontech · 국내영업 매출현황</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230891b2'/><g transform='translate(13,36) scale(0.144)' fill='%23fff'><rect width='110' height='110' rx='28'/><rect x='204' width='110' height='110' rx='28'/><rect x='408' width='110' height='110' rx='28'/><rect x='102' y='97' width='110' height='110' rx='28'/><rect x='306' y='97' width='110' height='110' rx='28'/></g></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--blue:#2563eb;--navy:#16324f;--ink:#182230;--text:#1f2937;--text-2:#64748b;--mut:#94a3b8;--border:#e4e8ef;--line:#eef1f5;--bg:#f5f7fb;--white:#fff;--green:#15803d;--red:#dc2626;--amber:#d97706;--hover:#eef2f7;--active:#eaf1fd}
*{box-sizing:border-box}
html{color-scheme:only light}
body{min-height:100vh;background:var(--bg);font-family:'Noto Sans KR',sans-serif;margin:0;color:var(--text);font-size:14px}
.tabular{font-variant-numeric:tabular-nums}
/* ── 상단 네비바 ── */
.wt-top{position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:4px;background:#fff;border-bottom:1px solid var(--border);padding:0 22px;height:54px;box-shadow:0 1px 8px rgba(16,42,67,.05)}
.wt-top .brand{display:flex;align-items:center;gap:9px;padding-right:15px;margin-right:5px;border-right:1px solid var(--line);flex-shrink:0}
.wt-top .brand .ico{width:30px;height:30px;background:var(--blue);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0}
.wt-top .brand b{font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-.2px;line-height:1.1}
.wt-top .brand span{font-size:9.5px;color:var(--mut);display:block;font-weight:500}
.wt-top nav{display:flex;align-items:center;gap:1px;flex:1;overflow-x:auto;scrollbar-width:none}
.wt-top nav::-webkit-scrollbar{display:none}
.tnav{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;font-size:13.5px;font-weight:600;color:#475569;cursor:pointer;white-space:nowrap;border:none;background:none;transition:all .13s}
.tnav i{font-size:15px}
.tnav:hover{background:var(--hover);color:var(--ink)}
.tnav.on{background:var(--active);color:var(--blue)}
.tnav .bdg{background:#eef2f7;color:#475569;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 7px;min-width:19px;text-align:center;font-variant-numeric:tabular-nums}
.tnav.on .bdg{background:#dbe6fb;color:var(--blue)}
.tnav .bdg.rd{background:#fdeaea;color:var(--red)}
.wt-top .util{display:flex;align-items:center;gap:2px;margin-left:auto;flex-shrink:0}
.uic{position:relative;display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:#475569;font-size:12.5px;font-weight:600;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.uic:hover{background:var(--hover);color:var(--blue)}
.uic i{font-size:15px}
.uic .dot{position:absolute;top:5px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid #fff}
.dd{position:relative}
.dd-menu{display:none;position:absolute;top:112%;right:0;min-width:190px;background:#fff;border:1px solid var(--border);border-radius:11px;overflow:hidden;box-shadow:0 10px 30px rgba(16,42,67,.16);z-index:400}
.dd-menu.open{display:block}
.dd-item{display:flex;align-items:center;gap:9px;padding:9px 13px;font-size:12.5px;color:#475569;cursor:pointer;white-space:nowrap}
.dd-item:hover{background:var(--hover)}
.dd-item .bdg{min-width:26px;height:19px;border-radius:5px;color:#fff;font-size:9.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0}
.dd-head{padding:9px 13px 6px;font-size:10px;font-weight:700;color:var(--mut);letter-spacing:.05em;text-transform:uppercase}
/* ── 메인 ── */
.main{max-width:none;margin:0;padding:20px 22px 80px}
.wt-mast{padding-bottom:13px;border-bottom:2px solid var(--navy);margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px}
.wt-mast .kick{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.wt-mast .t{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.01em;margin-top:4px;display:flex;align-items:center;gap:9px}
.wt-mast .t i{color:var(--blue);font-size:20px}
.wt-mast .asof{font-size:12px;color:var(--text-2);text-align:right}
#chgbar{margin-bottom:16px}
.chg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#eff5ff;border:1px solid #cfe0fb;border-radius:10px;padding:9px 14px;font-size:12.5px;color:#42506a}
.chg>i{color:var(--blue);font-size:14px}
.chg .lb{font-weight:700;color:var(--ink)}
.chg b{font-weight:700;background:#fff;border:1px solid #d8e3f5;border-radius:20px;padding:2px 11px;color:var(--blue);font-variant-numeric:tabular-nums}
.chg b.g{color:var(--green);border-color:#bbf7d0}.chg b.r{color:var(--red);border-color:#fecaca}
.chg .mo{background:none;border:none;color:var(--blue);font-size:12px;font-weight:600;text-decoration:underline;cursor:pointer}
.chg .cx{margin-left:auto;background:none;border:none;color:var(--mut);font-size:13px;cursor:pointer}
/* 필터 툴바 */
.wt-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:18px}
.wt-tools .fl{font-size:11px;font-weight:700;color:var(--text-2);display:flex;align-items:center;gap:5px}
.wt-tab{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#475569;background:#fff;border:1px solid #dbe3ec;border-radius:8px;padding:6px 13px;cursor:pointer;transition:all .15s;line-height:1;white-space:nowrap}
.wt-tab:hover{background:#eff4fb;border-color:#a9c4e8;color:var(--blue)}
.wt-tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.wt-tools .form-select,.wt-tools .form-control{font-size:12.5px;border-color:#dbe3ec;color:var(--text);border-radius:8px;padding:6px 11px;width:auto}
.wt-tools .form-select{padding-right:30px;min-width:112px}
.wt-asof{margin-left:auto;font-size:11.5px;color:var(--mut);font-weight:600;white-space:nowrap}
.wt-tools .form-control:focus,.wt-tools .form-select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.wt-sep{width:1px;height:22px;background:var(--border);margin:0 3px}
.wt-cnt{margin-left:12px;font-size:12px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums}
.wt-cnt b{color:var(--ink)}
/* 히어로+팩트 밴드 */
.wt-band{display:flex;align-items:stretch;background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px 24px;margin-bottom:18px;flex-wrap:wrap;gap:6px 0}
.wt-hero{flex:1.2;padding-right:22px;display:flex;flex-direction:column;justify-content:center;min-width:180px}
.wt-hero .l{font-size:11.5px;font-weight:700;color:var(--text-2)}
.wt-hero>b{font-size:36px;font-weight:800;color:var(--blue);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.08}
.wt-hero>b.rd{color:var(--red)}
.wt-hero>b .u{font-size:18px;font-weight:700;margin-left:2px}
.wt-hero .s{font-size:12px;color:var(--text-2);margin-top:3px}
.wt-fact{flex:1;padding:2px 16px;border-left:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;min-width:120px}
.wt-fact.clk{cursor:pointer}.wt-fact.clk:hover .l{color:var(--blue)}
.wt-fact .l{font-size:11px;font-weight:700;color:var(--text-2);white-space:nowrap}
.wt-fact b{font-size:21px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:2px}
.wt-fact b .u{font-size:12px;font-weight:700;margin-left:1px}
.wt-fact .s{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt-fact b.rd{color:var(--red)}.wt-fact b.gr{color:var(--green)}.wt-fact b.am{color:var(--amber)}
/* 카드/섹션 */
.wt-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 18px;min-width:0}
.wt-st{font-size:14px;font-weight:800;color:var(--ink);padding-bottom:8px;border-bottom:2px solid var(--navy);margin-bottom:13px;display:flex;align-items:center;gap:8px}
.wt-st i{color:var(--blue);font-size:15px}
.wt-st .hint{margin-left:auto;font-size:11px;font-weight:500;color:var(--mut)}
.wt-st .mo{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--blue);cursor:pointer;text-decoration:none}
.wt-grid{display:grid;gap:16px}
.g-2{grid-template-columns:1fr 1fr}.g-32{grid-template-columns:1.6fr 1fr}
/* 표 */
.wt-tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.wt-tbl thead th{background:#fafbfc;color:#475569;font-size:11.5px;font-weight:700;border-top:2px solid var(--navy);border-bottom:1px solid var(--border);padding:8px 10px;text-align:right;white-space:nowrap;position:sticky;top:0;cursor:pointer;user-select:none}
.wt-tbl thead th.l{text-align:left}.wt-tbl thead th:hover{color:var(--blue)}
.wt-tbl tbody td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right;white-space:nowrap;color:var(--text)}
.wt-tbl tbody td.l{text-align:left}
.wt-tbl tbody tr{cursor:pointer}
.wt-tbl tbody tr:hover{background:#f8fafc}
.wt-tbl .rk{color:var(--mut);font-weight:700;text-align:center;width:26px}
.wt-tbl .nm{font-weight:600;color:var(--ink)}
.wt-tbl b{color:var(--ink);font-weight:700}
.wt-tbl th:not(.l),.wt-tbl td:not(.l){width:1px}
.mut{color:var(--mut)}.tx2{color:var(--text-2)}
.scroll{overflow:auto;max-height:64vh}
.badge-st{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:34px}
.warnnote{font-size:12px;color:#8a6d3b;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 13px}
/* 메시지 */
.msg{display:flex;gap:11px;padding:12px 2px;border-bottom:1px solid var(--line)}
.msg .av{width:30px;height:30px;border-radius:50%;background:var(--active);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.msg .bd{flex:1;min-width:0}
.msg .hd{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:3px}
.msg .hd .au{font-weight:700;color:var(--ink)}
.msg .hd .tm{color:var(--mut);font-size:11px}
.msg .hd .del{margin-left:auto;background:none;border:none;color:var(--mut);font-size:11px;cursor:pointer}
.msg .hd .del:hover{color:var(--red)}
.msg .tx{font-size:13px;color:var(--text);line-height:1.55;white-space:pre-wrap;word-break:break-word}
.composer{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.composer textarea{flex:1;border:1px solid #dbe3ec;border-radius:9px;padding:9px 12px;font-family:inherit;font-size:13px;resize:vertical;min-height:42px}
.composer textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.composer .btn{white-space:nowrap}
.msg-cols{column-count:2;column-gap:16px;margin-top:14px}
.msg-cols .msg{border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin:0 0 14px;break-inside:avoid}
@media(max-width:900px){.msg-cols{column-count:1}}
/* 빠른 검색 */
.gsearch{position:relative;display:flex;align-items:center;gap:7px;background:#f1f5f9;border:1px solid #e4e8ef;border-radius:9px;padding:6px 10px;width:230px;margin:0 6px;flex-shrink:0}
.gsearch>i{color:var(--mut);font-size:14px}
.gsearch input{border:none;background:none;outline:none;font-family:inherit;font-size:12.5px;color:var(--ink);flex:1;min-width:0}
.gsearch kbd{font-size:10px;color:var(--mut);background:#fff;border:1px solid #dbe3ec;border-radius:5px;padding:1px 6px;font-family:inherit}
.gs-dd{display:none;position:absolute;top:120%;right:0;background:#fff;border:1px solid var(--border);border-radius:11px;box-shadow:0 12px 32px rgba(16,42,67,.16);z-index:400;overflow:hidden;max-height:62vh;overflow-y:auto;width:360px}
.gs-dd.open{display:block}
.gs-item{padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--line)}
.gs-item:last-child{border-bottom:none}
.gs-item.sel,.gs-item:hover{background:var(--active)}
.gs-item .t{font-size:13px;font-weight:600;color:var(--ink)}
.gs-item .m{font-size:11px;color:var(--text-2);margin-top:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.gs-empty{padding:16px;text-align:center;color:var(--mut);font-size:12.5px}
mark{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
/* 필터 칩 */
#fchips{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:-4px 0 16px}
#fchips:empty{display:none}
#fchips .fc-lb{font-size:11px;font-weight:700;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:4px;background:#eef4fd;border:1px solid #d3e2fb;color:#2455c4;font-size:11.5px;font-weight:600;border-radius:20px;padding:3px 6px 3px 11px}
.chip i{cursor:pointer;font-size:13px;color:#7794c9}
.chip i:hover{color:var(--red)}
.chip-clr{background:none;border:none;color:var(--text-2);font-size:11.5px;text-decoration:underline;cursor:pointer}
/* 복사 가능 값 */
.drow .v.cp{cursor:pointer}
.drow .v.cp i{opacity:0;margin-left:5px;color:var(--mut);font-size:11px;transition:opacity .12s}
.drow:hover .v.cp i{opacity:1}
.drow .v.cp:hover{color:var(--blue)}
.mhd .x[disabled]{opacity:.3;cursor:default}
.dact{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.dact .btn i{font-size:13px}
.cform{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.cform .cf{display:flex;flex-direction:column;gap:4px;min-width:0}
.cform .cf.wide{grid-column:1/-1}
.cform .cf label{font-size:11px;font-weight:700;color:var(--text-2)}
.cform-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
@media(max-width:640px){.cform{grid-template-columns:1fr}}
.paygrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:820px){.paygrid{grid-template-columns:1fr}}
.paycard{border:1px solid var(--border);border-radius:11px;padding:10px 13px;cursor:pointer;transition:border-color .12s,background .12s}
.paycard:hover{border-color:#a9c4e8;background:#f8fafc}
.pc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pc-cust{font-weight:700;color:var(--ink);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-btn{padding:2px 13px;font-size:11px;flex-shrink:0}
.pc-meta{font-size:12px;color:var(--text);margin-top:5px}
.pc-sub{font-size:11.5px;color:var(--text-2);margin-top:3px}
/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(16,42,67,.42);display:none;align-items:center;justify-content:center;z-index:8000;padding:16px}
.modal-bg.on{display:flex}
.mbox{background:#fff;border-radius:18px;max-width:860px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 12px 34px rgba(15,23,42,.16);border:1px solid var(--border)}
.dcols{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}
.dcols .dsec:first-child{margin-top:2px}
@media(max-width:720px){.dcols{grid-template-columns:1fr}.mbox{max-width:640px}}
.mhd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 22px 13px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.mhd h3{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.01em;margin:0}
.mhd .x{background:none;border:none;font-size:19px;color:var(--mut);line-height:1;cursor:pointer}
.mbody{padding:16px 22px 22px}
.dsec{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.04em;margin:13px 0 4px;text-transform:uppercase}
.dsec:first-child{margin-top:0}
.drow{display:flex;justify-content:space-between;gap:14px;padding:5.5px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.drow .k{color:var(--text-2);flex-shrink:0}
.drow .v{font-weight:600;color:var(--ink);text-align:right}
.tl{display:flex;margin:12px 0 4px}
.tl .st{flex:1;text-align:center;position:relative;font-size:10.5px}
.tl .st .dot{width:11px;height:11px;border-radius:50%;background:#cbd5e1;margin:0 auto 5px;border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1}
.tl .st.done .dot{background:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.tl .st b{display:block;color:var(--ink);font-weight:600;margin-bottom:1px}
.tl .st .dt{color:var(--mut);font-size:10px}
.tl .st:not(:last-child):after{content:'';position:absolute;top:5px;left:50%;width:100%;height:2px;background:#e2e8f0;z-index:0}
.tl .st.done:not(:last-child):after{background:var(--blue)}
/* 로딩/로그인 */
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:9000;color:var(--mut);font-size:13px}
.spin{width:22px;height:22px;border:3px solid #dbe3ee;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin-right:10px}
@keyframes sp{to{transform:rotate(360deg)}}
#login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f2540,#1e3a5f);z-index:9001;padding:20px}
.lbox{background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.lbox h1{font-size:17px;font-weight:800;color:var(--ink);margin:0 0 3px;display:flex;align-items:center;gap:8px}
.lbox h1 i{color:var(--blue)}
.lbox p{font-size:12px;color:var(--mut);margin:0 0 20px}
.lbox .form-control{margin-bottom:10px;font-size:14px;padding:11px 13px}
.lbox .btn{width:100%;font-weight:700;padding:11px;margin-top:4px}
#login-err{display:none;color:var(--red);font-size:12px;margin-top:8px;text-align:center}
#noacc{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:9001;color:var(--ink);text-align:center;padding:30px;gap:16px}
#toast{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:9500}
.view{display:none}.view.on{display:block}
#topwrap{display:none}
@media(max-width:820px){
  .main{padding:16px 14px 70px}
  .g-2,.g-32{grid-template-columns:1fr}
  .wt-top{gap:2px;padding:0 10px}
  .wt-top .brand span{display:none}
  .tnav span.lbl{display:none}.tnav{padding:8px 10px}
  .uic span{display:none}
  .gsearch{width:150px;margin:0 4px}
  .wt-hero{flex:1 1 100%;border-bottom:1px solid var(--border);padding:0 0 12px;margin-bottom:4px}.wt-fact{border-left:0;padding:0;flex:1 1 44%}
}
</style>
</head>
<body>

<div id="load"><div class="spin"></div>불러오는 중…</div>

<div id="login">
  <div class="lbox">

const VIEWS=[
 ['work','bi-lightning-charge','워크데스크','오늘 처리할 일 — 시스템이 계산한 큐'],
 ['ledger','bi-journal-text','계약 대장','전체 계약 검색·조회·입력'],
 ['closing','bi-calendar2-check','월말 정리','월별 완결 체크·마감'],
 ['messages','bi-chat-dots','메시지','팀 공유 · 변동 공지']];
const NEEDTOOLS={ledger:1};
function queues(){ const T=today0();
  const undel=ROWS.filter(r=>!has(r.dDelivered));
  return {
    late: undel.filter(r=>{const d=pd(r.dDeliverDue);return d&&d<T;}).sort((a,b)=>pd(a.dDeliverDue)-pd(b.dDeliverDue)),
    due:  undel.filter(r=>{const d=pd(r.dDeliverDue);return !d||d>=T;}).sort((a,b)=>{const x=pd(a.dDeliverDue),y=pd(b.dDeliverDue);if(!x&&!y)return 0;if(!x)return 1;if(!y)return -1;return x-y;}),
    coup: ROWS.filter(r=>isCoupon(r.product)&&has(r.dDelivered)&&!has(r.couponDate)),
    comm: ROWS.filter(r=>(r.channel==='대리점'||r.channel==='딜러')&&!commPaid(r)),
    tax:  ROWS.filter(r=>!has(r.dTax))

}

function _fld(f,c){ const label=f[0],key=f[1],type=f[2],v=(c&&c[key]!=null)?c[key]:''; let input;

    '<div style="text-align:right;margin:-40px 0 8px;display:flex;gap:8px;justify-content:flex-end"><button class="wt-tab" onclick="newContract()"><i class="bi bi-plus-lg"></i>신규</button><button class="wt-tab" onclick="exportCsv()"><i class="bi bi-download"></i>CSV</button>'+((window.__trash&&window.__trash.length)?'<button class="wt-tab" onclick="showTrash()"><i class="bi bi-trash"></i>휴지통 '+window.__trash.length+'</button>':'')+'</div>'+
    '<div class="scroll"><table class="wt-tbl"><thead><tr>'+
    cols.map(c=>'<th class="'+c[2]+'"'+(c[0]==='_stage'?'':' onclick="sortList(\''+c[0]+'\')"')+'>'+c[1]+(_sortKey===c[0]?(_sortDir>0?' ▲':' ▼'):'')+'</th>').join('')+
    '</tr></thead><tbody>'+
    (R.length?R.map(c=>'<tr onclick="detail('+c.no+')"><td class="rk">'+c.no+'</td><td class="l nm">'+esc(c.cust)+'</td><td class="l tx2">'+esc(c.biznum||'-')+'</td><td class="l">'+esc(c.product)+'</td><td class="l">'+esc(c.rep)+'</td><td class="l">'+esc(c.channel)+'</td><td>'+(c.saleMonth?c.saleMonth+'월':'-')+'</td><td class="l">'+stChip(c.status)+'</td><td class="l">'+stageDots(c)+'</td></tr>').join(''):'<tr><td colspan="9" class="empty">해당 조건의 계약이 없습니다</td></tr>')+
    '</tbody></table></div></div>';
  document.getElementById('view-ledger').innerHTML=h;
}

function showTrash(){ const tr=window.__trash||[]; window.__dno=null;
  document.getElementById('mbox').innerHTML='<div class="mhd"><div><h3><i class="bi bi-trash" style="color:var(--text-2);margin-right:6px"></i>휴지통 <span class="tx2" style="font-size:13px;font-weight:600">'+tr.length+'건</span></h3><div class="tx2" style="font-size:12px;margin-top:3px">삭제된 계약 — [복구]로 되살립니다</div></div><button class="x" onclick="closeModal()"><i class="bi bi-x-lg"></i></button></div>'+
    '<div class="mbody">'+(tr.length?tr.map(r=>'<div class="drow"><span class="k">#'+r.no+' '+esc(r.cust)+' <span class="mut">'+esc(r.product)+'</span></span><span class="v"><button class="btn btn-sm btn-outline-primary" style="padding:1px 12px;font-size:11px" onclick="(async()=>{await restoreContract('+r._id+');showTrash();})()">복구</button></span></div>').join(''):'<div class="empty">휴지통이 비어 있습니다</div>')+'</div>';
  document.getElementById('modal').classList.add('on'); }

/* ══ 월말 정리 (완결 체크매트릭스) ══ */
let _clsM=0,_clsOpen=false;
function clsMonth(m){ _clsM=m; render(); }
function clsToggle(){ _clsOpen=!_clsOpen; render(); }
function _needs(r){ const need=[]; if(!has(r.dDelivered))need.push('납품'); if(!has(r.dTax))need.push('계산서');
  if(isCoupon(r.product)&&has(r.dDelivered)&&!has(r.couponDate))need.push('쿠폰지급');
  if((r.channel==='대리점'||r.channel==='딜러')&&!commPaid(r))need.push('수수료'); return need; }
function vClosing(){
  const months=[...new Set(ROWS.map(r=>r.saleMonth).filter(Boolean))].sort((a,b)=>a-b);
  const m=(months.indexOf(_clsM)>=0)?_clsM:(months[months.length-1]||0); _clsM=m;
  const rows=ROWS.filter(r=>r.saleMonth===m).sort((a,b)=>a.no-b.no);
  const open=rows.filter(r=>_needs(r).length);
  const chk=v=>v?'<i class="bi bi-check-circle-fill" style="color:var(--green)"></i>':'<i class="bi bi-x-circle" style="color:var(--red)"></i>';
  const nd=(r,k)=>_needs(r).indexOf(k)>=0;
  const show=_clsOpen?open:rows;
  let h='<div class="wt-band" style="padding:16px 22px">'+
    '<div class="wt-hero"><span class="l">'+m+'월 완결률</span><b'+(open.length?'':' class="gr"')+'>'+pctv(rows.length-open.length,rows.length)+'<span class="u">%</span></b><span class="s">'+(rows.length-open.length)+' / '+rows.length+'건 완결 · 미완결 '+open.length+'건</span></div>'+
    fact('계약 매출',eok(rows.reduce((s,x)=>s+(x.krw||0),0)).toFixed(1),'억',rows.length+'건')+
    fact('납품 완료',rows.filter(r=>has(r.dDelivered)).length+'/'+rows.length,'','미납 '+rows.filter(r=>!has(r.dDelivered)).length)+
    fact('계산서 발행',rows.filter(r=>has(r.dTax)).length+'/'+rows.length,'','미발행 '+rows.filter(r=>!has(r.dTax)).length)+
    fact('쿠폰·수수료 잔여',rows.filter(r=>nd(r,'쿠폰지급')).length+' · '+rows.filter(r=>nd(r,'수수료')).length,'','지급대기 · 미처리')+
  '</div>';
  h+='<div class="wt-card"><div class="wt-st"><i class="bi bi-calendar2-check"></i>월별 완결 체크'+
    '<span style="margin-left:10px;display:inline-flex;gap:4px;flex-wrap:wrap">'+months.map(x=>'<button class="wt-tab'+(x===m?' on':'')+'" style="padding:3px 11px" onclick="clsMonth('+x+')">'+x+'월</button>').join('')+'</span>'+
    '<span class="hint"><label style="cursor:pointer"><input type="checkbox" '+(_clsOpen?'checked':'')+' onclick="clsToggle()"> 미완결만</label> · '+show.length+'건 · <button class="wt-tab" style="padding:2px 10px" onclick="closingCsv()"><i class="bi bi-download"></i>월 CSV</button></span></div>'+
    twoColTbl(show,'<th class="rk">#</th><th class="l">거래처</th><th class="l">제품</th><th class="l">담당</th><th>납품</th><th>계산서</th><th>쿠폰</th><th>수수료</th><th>수금</th>',
      r=>{const cpT=isCoupon(r.product),cmT=(r.channel==='대리점'||r.channel==='딜러');
      return '<tr onclick="detail('+r.no+')"'+(_needs(r).length?' style="background:#fffdf5"':'')+'><td class="rk">'+r.no+'</td><td class="l nm">'+esc(r.cust)+'</td><td class="l">'+esc(r.product)+'</td><td class="l">'+esc(r.rep)+'</td><td>'+chk(has(r.dDelivered))+'</td><td>'+chk(has(r.dTax))+'</td><td>'+(cpT?chk(has(r.couponDate)):'<span class="mut">-</span>')+'</td><td>'+(cmT?chk(commPaid(r)):'<span class="mut">-</span>')+'</td><td>'+(has(r.payDate)?chk(true):'<span class="mut">-</span>')+'</td></tr>';},62)+
    '</div>';
  document.getElementById('view-closing').innerHTML=h;
}
function closingCsv(){
  const rows=ROWS.filter(r=>r.saleMonth===_clsM).sort((a,b)=>a.no-b.no);
  const cols=[['no','NO'],['cust','거래처'],['biznum','사업자번호'],['product','제품'],['rep','담당자'],['channel','채널'],['amount','계약금액'],['krw','원화환산'],['dDelivered','납품일'],['dTax','세금계산서'],['couponDate','쿠폰지급일'],['couponQty','지급수량'],['commission','수수료참조'],['pay','수금방법'],['payDate','수금일'],['shipReqNo','출고요청서'],['status','상태']];
  let csv='﻿'+cols.map(c=>c[1]).join(',')+'\n';
  rows.forEach(r=>{ csv+=cols.map(c=>{let v=r[c[0]];v=(v==null?'':String(v)).replace(/"/g,'""');return /[",\n]/.test(v)?'"'+v+'"':v;}).join(',')+'\n'; });
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='국내영업_'+_clsM+'월_월말정리.csv'; a.click(); toast(_clsM+'월 CSV 내보내기 완료');
}
function quickPayDate(no){ const c=ROWS.find(r=>r.no===no); if(!c)return; window.__dno=null;
  document.getElementById('mbox').innerHTML='<div class="mhd"><div><h3><i class="bi bi-credit-card-2-front" style="color:var(--blue);margin-right:6px"></i>수금일 기록</h3><div class="tx2" style="font-size:12px;margin-top:3px">#'+no+' '+esc(c.cust)+' · '+esc(c.pay||'수금방법 미기재')+'</div></div><button class="x" onclick="closeModal()"><i class="bi bi-x-lg"></i></button></div>'+
    '<div class="mbody"><div class="cform"><div class="cf"><label>수금일</label><input id="qp-date" type="date" class="form-control form-control-sm" value="'+todayStr()+'"></div></div>'+
    '<div class="cform-foot"><span></span><div style="display:flex;gap:8px"><button class="btn btn-outline-secondary btn-sm" onclick="closeModal()">취소</button><button class="btn btn-primary btn-sm" onclick="saveQuick('+no+',\'payDate\',\'qp-date\',\'수금일 기록\')"><i class="bi bi-check-lg"></i> 저장</button></div></div></div>';
  document.getElementById('modal').classList.add('on'); }

/* ── CSV ── */
function exportCsv(){
  const R=filtered().slice().sort((a,b)=>a.no-b.no);
  const cols=[['no','NO'],['cust','거래처'],['product','제품'],['amount','계약금액'],['krw','원화환산'],['rep','담당자'],['channel','채널'],['status','상태'],['saleMonth','매출월'],['region','지역'],['biz','진료과'],['shipReqNo','출고요청서번호'],['pay','수금방법'],['payDate','수금일'],['dContract','계약접수'],['dDelivered','납품일'],['couponDate','지급일'],['couponQty','지급수량'],['dTax','세금계산서']];
  let csv='\ufeff'+cols.map(c=>c[1]).join(',')+'\n';
  R.forEach(r=>{ csv+=cols.map(c=>{let v=r[c[0]];v=(v==null?'':String(v)).replace(/"/g,'""');return /[",\n]/.test(v)?'"'+v+'"':v;}).join(',')+'\n'; });
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='국내영업_계약_'+(DATA.updatedAt||'')+'.csv'; a.click(); toast('CSV 내보내기 완료');
}

/* ── 변동 감지 ── */
function detectChanges(){
  try{ const key='wtKorSnap:'+ME; const cur={};
    ROWS.forEach(r=>{ cur[r.no]=(has(r.dDelivered)?'D':'_')+(/취소/.test((r.status||'')+(r.pay||''))?'X':''); });
    let prev=null; try{ prev=JSON.parse(localStorage.getItem(key)||'null'); }catch(e){}
    const chg={neo:[],del:[],can:[]};
    if(prev&&prev.map){ ROWS.forEach(r=>{ const p=prev.map[r.no], c=cur[r.no];
      if(p===undefined){ chg.neo.push(r); }
      else{ if(p[0]!=='D'&&c[0]==='D')chg.del.push(r); if(p.indexOf('X')<0&&c.indexOf('X')>=0)chg.can.push(r); } }); }
    window.__chg=(prev&&prev.map)?chg:null;
    localStorage.setItem(key,JSON.stringify({rev:DATA.updatedAt||'',map:cur}));
  }catch(e){ window.__chg=null; }
}
function renderChgBar(){ const c=window.__chg, el=document.getElementById('chgbar'); if(!el)return;
  const dot=document.getElementById('alarm-dot'); if(dot)dot.style.display=(c&&(c.neo.length||c.del.length||c.can.length))?'block':'none';
  if(!c||(!c.neo.length&&!c.del.length&&!c.can.length)){ el.innerHTML=''; return; }
  el.innerHTML='<div class="chg"><i class="bi bi-bell-fill"></i><span class="lb">지난 방문 이후 변동</span>'+
    (c.neo.length?'<b>신규 계약 '+c.neo.length+'</b>':'')+
    (c.del.length?'<b class="g">납품 완료 전환 '+c.del.length+'</b>':'')+
    (c.can.length?'<b class="r">취소 '+c.can.length+'</b>':'')+
    '<button class="mo" onclick="showChg()">자세히</button><button class="cx" onclick="document.getElementById(\'chgbar\').innerHTML=\'\'"><i class="bi bi-x-lg"></i></button></div>'; }
function showChg(){ window.__dno=null; const c=window.__chg;
  if(!c||(!c.neo.length&&!c.del.length&&!c.can.length)){ toast('지난 방문 이후 변동이 없습니다'); return; }
  const sec=(t,arr,color)=>arr.length?'<div class="dsec" style="color:'+color+'">'+t+' '+arr.length+'건</div>'+arr.map(r=>'<div class="drow" style="cursor:pointer" onclick="closeModal();detail('+r.no+')"><span class="k">#'+r.no+' '+esc(r.cust)+'</span><span class="v">'+esc(r.product)+' · '+esc(r.region||'')+'</span></div>').join(''):'';
  document.getElementById('mbox').innerHTML='<div class="mhd"><div><h3>지난 방문 이후 변동</h3><div class="tx2" style="font-size:12px;margin-top:3px">기준일 '+esc(DATA.updatedAt||'')+' · 접속 시점 대비</div></div><button class="x" onclick="closeModal()"><i class="bi bi-x-lg"></i></button></div><div class="mbody">'+
    (sec('신규 계약',c.neo,'#2563eb'))+(sec('납품 완료 전환',c.del,'#15803d'))+(sec('취소',c.can,'#dc2626'))+'</div>';
  document.getElementById('modal').classList.add('on'); }

/* ── 사이트 스위처 ── */
async function renderSwitcher(){
  let reg=[]; try{ reg=(await _sb.from('site_registry').select('*').order('sort_order')).data||[]; }catch(e){}
  let ac=[],ad=false,stf=false; try{ const s=(await _sb.auth.getSession()).data.session; if(s&&s.user){ if(s.user.email==='pmw0406@gmail.com')ad=true; const p=await _sb.from('crm_profiles').select('access,role,dept').eq('id',s.user.id).maybeSingle(); if(p&&p.data){ac=(p.data.access||'').split(',').map(x=>x.trim()).filter(Boolean); if(p.data.role==='admin')ad=true; stf=String(p.data.dept||'').replace(/\s/g,'').includes('영업전략');} } }catch(e){}
  const vis=s=>{ if(ac.indexOf(s.key)>=0)return true; if(s.admin_bypass&&ad)return true; if(s.extra_visible_rule){try{return !!(new Function('access','isAdmin','isStrat','return('+s.extra_visible_rule+')'))(ac,ad,stf);}catch(e){return false;}} return false; };
  const seen={}; const items=reg.filter(s=>{ if(s.key==='kor_sales')return false; if(!vis(s))return false; const d=(s.url==='LOCAL'||s.key==='korea')?'wontech':s.url; if(seen[d])return false; seen[d]=1; return true; });
  document.getElementById('sw-dd').innerHTML='<div class="dd-head">사이트 이동</div>'+(items.map((s,i)=>'<div class="dd-item" onclick="swGo('+i+')"><span class="bdg" style="background:'+(s.grad_from||'#64748b')+'">'+esc(s.badge||'')+'</span>'+esc(s.title||s.key)+'</div>').join('')||'<div class="dd-item mut">이동 가능한 사이트 없음</div>');
  window._swItems=items;
}
async function swGo(i){ const s=window._swItems[i]; if(!s)return; let u=(s.url==='LOCAL'||s.key==='korea')?CENTRAL:s.url; let sess=null; try{sess=(await _sb.auth.getSession()).data.session;}catch(e){} if(sess&&u.indexOf('#')<0)u+='#at='+encodeURIComponent(sess.access_token)+'&rt='+encodeURIComponent(sess.refresh_token); location.href=u; }
